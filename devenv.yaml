inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  # Pinned to the revision in /etc/nix-darwin/flake.lock so this env shares
  # store paths with the system and the other projects. The default rolling
  # input locks per project and shares nothing. Move it with the system flake.
  nixpkgs:
    url: github:NixOS/nixpkgs/f8e81fc7eb063db454f563cdd596fb96a5ad1497
